---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: swaggerdefinitions.swagger.infra.doodle.com
spec:
  group: swagger.infra.doodle.com
  names:
    kind: SwaggerDefinition
    listKind: SwaggerDefinitionList
    plural: swaggerdefinitions
    singular: swaggerdefinition
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SwaggerDefinitionSpec defines the desired state of SwaggerDefinition.
            properties:
              auth:
                description: |-
                  Auth configures how the controller authenticates while fetching the
                  definition from url. It is only evaluated by SwaggerSpecification which
                  fetches definitions server side.
                properties:
                  basic:
                    description: Basic configures http basic authentication.
                    properties:
                      allowInsecure:
                        description: AllowInsecure permits sending the credentials
                          to a plain http:// url.
                        type: boolean
                      secretRef:
                        description: |-
                          SecretRef references a secret in the same namespace as the SwaggerDefinition
                          which holds the credentials.
                        properties:
                          name:
                            description: Name of the secret.
                            type: string
                          passwordField:
                            default: password
                            description: PasswordField is the secret key which holds
                              the password.
                            type: string
                          usernameField:
                            default: username
                            description: |-
                              UsernameField is the secret key which holds the username. It is ignored if
                              a static username is configured.
